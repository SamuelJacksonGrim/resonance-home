name: test

# Runs the dependency-free suite on every push and PR. No `npm install` step:
# the project has zero runtime dependencies, so `npm test` just runs `node test.js`.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: for f in *.js eval/*.js; do node --check "$f"; done   # syntax-check every source, incl. files the tests don't import
      - run: npm test
      - run: npm run eval   # RH-13 router golden: safety must stay 100%
